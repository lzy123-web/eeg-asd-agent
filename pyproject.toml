[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eeg-asd-workflow-agent"
version = "0.1.0"
description = "Capability-aware, execution-grounded EEG-ASD workflow agent"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.7,<3",
  "typer>=0.12,<1",
  "numpy>=1.26,<3",
  "scipy>=1.12,<2",
  "jinja2>=3.1,<4",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "ruff>=0.5,<1",
  "mypy>=1.10,<2",
]
eeg = []
rag = [
  "neo4j>=5.20,<7",
]

[project.scripts]
eeg-asd-agent = "eeg_asd_agent.cli:app"

[tool.setuptools.packages.find]
include = ["eeg_asd_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = false
exclude = ["tests"]

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*"]
ignore_missing_imports = true
