<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EEG-ASD 评估 Agent</title>
  <style>
    :root{--ink:#17243b;--muted:#667085;--line:#d9e0ea;--panel:#fff;--bg:#f3f6fa;--blue:#3157d5;--teal:#087f75;--warn:#b54708;--danger:#b42318}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif;line-height:1.55}
    .topbar{height:6px;background:#3157d5}.shell{max-width:1180px;margin:auto;padding:42px 24px 64px}
    header{display:flex;justify-content:space-between;gap:24px;align-items:flex-start;margin-bottom:28px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--blue)}
    h1{font-size:34px;line-height:1.15;margin:7px 0 8px}.subtitle{color:var(--muted);max-width:690px;margin:0}.model{border:1px solid var(--line);background:#fff;padding:10px 14px;border-radius:10px;font-size:13px;white-space:nowrap}
    .grid{display:grid;grid-template-columns:400px 1fr;gap:22px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 28px rgba(29,45,73,.06)}
    .form-card{padding:24px}.result-card{min-height:620px;overflow:hidden}.section-title{font-size:18px;margin:0 0 18px}.field{margin-bottom:16px}label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}
    input,select,textarea{width:100%;border:1px solid #cbd5e1;border-radius:9px;padding:11px 12px;font:inherit;color:var(--ink);background:#fff}textarea{min-height:96px;resize:vertical}input:focus,select:focus,textarea:focus{outline:3px solid rgba(49,87,213,.13);border-color:var(--blue)}
    .drop{border:1.5px dashed #9cadc7;border-radius:12px;padding:18px;text-align:center;background:#f8faff}.drop input{border:0;padding:0;font-size:13px}.hint{font-size:12px;color:var(--muted);margin:7px 0 0}
    .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.button{width:100%;border:0;border-radius:10px;padding:12px 16px;background:var(--blue);color:#fff;font-weight:800;font-size:15px;cursor:pointer}.button:hover{background:#2446b7}.button:disabled{opacity:.55;cursor:not-allowed}
    .privacy{font-size:12px;color:var(--muted);margin:12px 0 0}.result-head{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.status{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:800}.dot{width:9px;height:9px;border-radius:50%;background:#98a2b3}.running .dot{background:var(--blue);animation:pulse 1.2s infinite}.completed .dot{background:var(--teal)}.failed .dot{background:var(--danger)}
    @keyframes pulse{50%{opacity:.25}}.empty{padding:90px 36px;text-align:center;color:var(--muted)}.empty-icon{font-size:44px;margin-bottom:12px}.workspace{display:none}.timeline{padding:18px 24px;border-bottom:1px solid var(--line);max-height:210px;overflow:auto}.step{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eef1f5;font-size:13px}.step:last-child{border:0}.step-name{font-family:ui-monospace,Consolas,monospace}.ok{color:var(--teal);font-weight:800}.bad{color:var(--danger);font-weight:800}
    .report-actions{display:none;gap:10px;padding:12px 24px;border-bottom:1px solid var(--line)}.link{color:var(--blue);font-size:13px;font-weight:750;text-decoration:none}.report-frame{width:100%;height:640px;border:0;background:#fff}.error{margin:18px 24px;padding:14px;border-radius:10px;background:#fff1f0;color:var(--danger);display:none;white-space:pre-wrap}
    @media(max-width:850px){header{display:block}.model{display:inline-block;margin-top:16px}.grid{grid-template-columns:1fr}.result-card{min-height:500px}}
  </style>
</head>
<body>
  <div class="topbar"></div>
  <main class="shell">
    <header>
      <div><div class="eyebrow">RESEARCH ASSESSMENT HARNESS</div><h1>EEG-ASD 评估 Agent</h1><p class="subtitle">上传脑电记录，由真实 LLM 规划并调用信号分析与知识检索工具，生成可追踪的研究性辅助评估报告。</p></div>
      <div class="model" id="modelBadge">正在检查 DeepSeek…</div>
    </header>
    <div class="grid">
      <section class="card form-card">
        <h2 class="section-title">新建评估</h2>
        <form id="assessmentForm">
          <div class="field"><label for="eeg">EEG 文件</label><div class="drop"><input id="eeg" name="eeg" type="file" accept=".edf,.npz,.mat" required><p class="hint">支持 EDF、NPZ、MAT，最大 1 GB</p></div></div>
          <div class="two"><div class="field"><label for="age">年龄</label><input id="age" name="age" type="number" min="0" max="120" step="0.1" placeholder="例如 8"></div><div class="field"><label for="sex">性别</label><select id="sex" name="sex"><option value="">未提供</option><option value="male">男</option><option value="female">女</option><option value="unknown">未知/其他</option></select></div></div>
          <div class="field"><label for="request">评估要求</label><textarea id="request" name="request">分析该儿童的 EEG，并生成 ASD 相关研究性评估报告。请说明信号质量、频谱、脑区、左右差异、连接性、知识证据与局限。</textarea></div>
          <button class="button" id="submitButton" type="submit">启动 LLM Agent</button>
          <p class="privacy">原始 EEG 文件和完整工具结果仅保存在本机；经脱敏、限量的分析摘要会发送给 DeepSeek，API Key 不会发送到浏览器。</p>
        </form>
      </section>
      <section class="card result-card">
        <div class="result-head"><h2 class="section-title" style="margin:0">运行结果</h2><div class="status idle" id="status"><span class="dot"></span><span>等待任务</span></div></div>
        <div class="empty" id="empty"><div class="empty-icon">⌁</div><strong>尚未开始评估</strong><p>提交 EEG 后，这里会显示 Agent 的逐步工具调用和最终报告。</p></div>
        <div class="workspace" id="workspace"><div class="timeline" id="timeline"></div><div class="error" id="error"></div><div class="report-actions" id="reportActions"><a class="link" id="openReport" target="_blank">在新窗口打开报告</a><a class="link" id="downloadReport" download>下载 Markdown</a></div><iframe class="report-frame" id="reportFrame" title="评估报告"></iframe></div>
      </section>
    </div>
  </main>
  <script>
    const form=document.querySelector('#assessmentForm'), button=document.querySelector('#submitButton'), statusBox=document.querySelector('#status'), empty=document.querySelector('#empty'), workspace=document.querySelector('#workspace'), timeline=document.querySelector('#timeline'), errorBox=document.querySelector('#error'), reportActions=document.querySelector('#reportActions'), reportFrame=document.querySelector('#reportFrame');
    const labels={queued:'已排队',running:'Agent 运行中',completed:'评估完成',failed:'运行失败'};
    async function health(){try{const r=await fetch('/api/health');const d=await r.json();document.querySelector('#modelBadge').textContent=d.llm.configured?`DeepSeek · ${d.llm.model}`:'DeepSeek 未配置';}catch{document.querySelector('#modelBadge').textContent='服务连接失败';}}
    function setStatus(value){statusBox.className=`status ${value}`;statusBox.querySelector('span:last-child').textContent=labels[value]||value;}
    function renderSteps(steps){timeline.innerHTML=steps.length?steps.map((s,i)=>`<div class="step"><span><b>${String(i+1).padStart(2,'0')}</b> <span class="step-name">${s.tool}</span></span><span class="${s.status==='success'?'ok':'bad'}">${s.status}${s.duration_ms?` · ${Math.round(s.duration_ms)} ms`:''}</span></div>`).join(''):'<p class="hint">LLM 正在制定首轮计划…</p>';}
    async function poll(runId){const r=await fetch(`/api/runs/${runId}`);const d=await r.json();setStatus(d.status);renderSteps(d.steps||[]);if(d.status==='completed'){button.disabled=false;button.textContent='启动新的评估';reportActions.style.display='flex';document.querySelector('#openReport').href=d.report_html_url;document.querySelector('#downloadReport').href=d.report_markdown_url;reportFrame.src=d.report_html_url;return;}if(d.status==='failed'){button.disabled=false;errorBox.style.display='block';errorBox.textContent=d.error||'未知错误';return;}setTimeout(()=>poll(runId),1200);}
    form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;button.textContent='正在上传…';empty.style.display='none';workspace.style.display='block';timeline.innerHTML='';errorBox.style.display='none';reportActions.style.display='none';reportFrame.removeAttribute('src');setStatus('queued');try{const r=await fetch('/api/runs',{method:'POST',body:new FormData(form)});const d=await r.json();if(!r.ok)throw new Error(d.detail||'创建任务失败');button.textContent='Agent 运行中';poll(d.run_id);}catch(err){button.disabled=false;button.textContent='启动 LLM Agent';setStatus('failed');errorBox.style.display='block';errorBox.textContent=err.message;}});
    health();
  </script>
</body>
</html>
